[project]
name = "coastguard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "langchain",
  "lightgbm",
  "shap",
  "geopandas",
  "shapely",
  "rasterio",
  "scikit-learn>=1.9.1",
  "pyarrow>=25.0.1",
  "requests>=2.34.2",
  "tqdm>=4.70.1",
  "langgraph>=1.2.14",
  "litellm>=1.104.2",
  "httpx>=0.28.1",
  "defusedxml>=0.7.1",
  "mcp<2",
  "google-auth>=2.61.0",
  "pyjwt>=2.15.1",
]
# ponytail: tensorflow (CASPIAN) added only if the Phase 7 gate passes

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "aiosqlite>=0.22.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
