[project]
name = "coastguard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "langchain",
  "lightgbm",
  "shap",
  "geopandas",
  "shapely",
  "rasterio",
  "scikit-learn>=1.9.1",
  "langgraph>=1.2.14",
  "litellm>=1.104.2",
]
# ponytail: tensorflow (CASPIAN) added only if the Phase 7 gate passes

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
